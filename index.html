<!DOCTYPE html>
<html lang="en" style="background-color: #0f172a;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Precision analog and digital world clock, alarms, timer, and stopwatch suite" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>World Clock</title>
    <style>
      /* Zero white flash / zero white gaps */
      html, body, #root {
        background-color: #0f172a !important;
        background: #0f172a !important;
        color: #f1f5f9;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        border: none !important;
        outline: none !important;
      }
      :fullscreen, ::backdrop, :-webkit-full-screen {
        background-color: #0f172a !important;
        background: #0f172a !important;
      }
    </style>
  </head>
  <body style="background-color: #0f172a; margin: 0; padding: 0;">
    <div id="root" style="background-color: #0f172a; width: 100%; height: 100%;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
