<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2030" />
      <stop offset="100%" stop-color="#0f121a" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ff7a59" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="200" fill="#161b26" stroke="url(#ring)" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Hour tick marks -->
  <circle cx="256" cy="86" r="6" fill="#e9edf4" />
  <circle cx="426" cy="256" r="6" fill="#e9edf4" />
  <circle cx="256" cy="426" r="6" fill="#e9edf4" />
  <circle cx="86" cy="256" r="6" fill="#e9edf4" />
  
  <!-- Hour hand (at ~10 o'clock) -->
  <polygon points="250,270 250,256 253,165 259,165 262,256 262,270" fill="#e9edf4" transform="rotate(-60 256 256)" />
  
  <!-- Minute hand (at ~2 o'clock) -->
  <polygon points="252,280 252,256 254,120 258,120 260,256 260,280" fill="#cbd5e1" transform="rotate(60 256 256)" />
  
  <!-- Second hand (at ~5 o'clock) -->
  <line x1="256" y1="290" x2="256" y2="105" stroke="#ff7a59" stroke-width="3.5" stroke-linecap="round" transform="rotate(150 256 256)" />
  
  <!-- Center hub -->
  <circle cx="256" cy="256" r="10" fill="#ff7a59" stroke="#e9edf4" stroke-width="3" />
</svg>
